name: bsd

topology:
  nodes:
    homer:
      kind: openbsd
      image: vrnetlab/openbsd_openbsd:7.9
    pe1:
      kind: openbsd
      image: vrnetlab/openbsd_openbsd:7.9
    p:
      kind: openbsd
      image: vrnetlab/openbsd_openbsd:7.9
    pe2:
      kind: openbsd
      image: vrnetlab/openbsd_openbsd:7.9
    ix:
      kind: openbsd
      image: vrnetlab/openbsd_openbsd:7.9
    pc:
      kind: linux
      image: vnc-desktop:bookworm
      image-pull-policy: Never
      ports:
        - 5900:5900/tcp
      env:
        VNC_PASSWORD: "cisco123"
        VNC_GEOMETRY: "1440x900"
        VNC_DEPTH: "24"
      exec:
        - ip link set eth1 up
        - ip addr add 192.168.1.1/24 dev eth1
        - ip route add 192.168.200.0/24 via 192.168.1.254
    www:
      kind: linux
      image: nginx:1.0
      exec:
        - ip link set eth1 up
        - ip addr add 192.168.200.1/24 dev eth1
        - ip route add 192.168.1.0/24 via 192.168.200.254
  links:
    - endpoints: [ "pc:eth1", "homer:eth1" ]
    - endpoints: [ "homer:eth2", "pe1:eth1" ]
    - endpoints: [ "pe1:eth2", "p:eth1" ]
    - endpoints: [ "p:eth2", "pe2:eth1" ]
    - endpoints: [ "pe2:eth2", "ix:eth1" ]
    - endpoints: [ "ix:eth2", "www:eth1" ]
